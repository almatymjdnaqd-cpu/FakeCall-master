name: OTP Automation Workflow

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  run-otp-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring
          coverage: none

      - name: Verify PHP Syntax and File Name
        run: |
          if [ -f "fakeCall.php" ]; then
            php -l fakeCall.php
          else
            echo "Error: fakeCall.php not found!"
            exit 1
          fi

      - name: Execute OTP Automation Script
        run: |
          # تشغيل السكريبت وإرسال خيار 'n' (عدم الدخول في حلقة تكرارية طويلة) لتجنب تعليق الـ Workflow
          printf "n\n+628123456789\n" | php fakeCall.php
